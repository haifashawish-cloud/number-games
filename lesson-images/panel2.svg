<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <!-- Sky & street background -->
  <rect width="500" height="380" fill="#87CEEB"/>

  <!-- Buildings -->
  <rect x="0" y="50" width="130" height="215" fill="#9B8EA0"/>
  <rect x="10" y="60" width="110" height="200" fill="#B0A0BC"/>
  <rect x="20" y="75" width="20" height="22" fill="#E0EEF8" rx="2"/>
  <rect x="55" y="75" width="20" height="22" fill="#E0EEF8" rx="2"/>
  <rect x="90" y="75" width="20" height="22" fill="#E0EEF8" rx="2"/>
  <rect x="20" y="110" width="20" height="22" fill="#E0EEF8" rx="2"/>
  <rect x="55" y="110" width="20" height="22" fill="#E0EEF8" rx="2"/>
  <rect x="90" y="110" width="20" height="22" fill="#E0EEF8" rx="2"/>
  <rect x="20" y="145" width="20" height="22" fill="#E0EEF8" rx="2"/>
  <rect x="55" y="145" width="20" height="22" fill="#E0EEF8" rx="2"/>
  <rect x="90" y="145" width="20" height="22" fill="#E0EEF8" rx="2"/>

  <rect x="360" y="40" width="140" height="225" fill="#8A7C90"/>
  <rect x="375" y="55" width="110" height="205" fill="#A08EA8"/>
  <rect x="385" y="70" width="22" height="22" fill="#D8EEF8" rx="2"/>
  <rect x="420" y="70" width="22" height="22" fill="#D8EEF8" rx="2"/>
  <rect x="455" y="70" width="22" height="22" fill="#D8EEF8" rx="2"/>
  <rect x="385" y="105" width="22" height="22" fill="#D8EEF8" rx="2"/>
  <rect x="420" y="105" width="22" height="22" fill="#D8EEF8" rx="2"/>
  <rect x="455" y="105" width="22" height="22" fill="#D8EEF8" rx="2"/>
  <rect x="385" y="140" width="22" height="22" fill="#D8EEF8" rx="2"/>
  <rect x="420" y="140" width="22" height="22" fill="#D8EEF8" rx="2"/>
  <rect x="385" y="175" width="22" height="22" fill="#D8EEF8" rx="2"/>
  <rect x="420" y="175" width="22" height="22" fill="#D8EEF8" rx="2"/>

  <!-- Footpath -->
  <rect x="0" y="260" width="500" height="120" fill="#9E9080"/>
  <line x1="0" y1="278" x2="500" y2="278" stroke="#8A7D6E" stroke-width="1.5"/>
  <!-- Pavement cracks / tiles -->
  <line x1="100" y1="260" x2="100" y2="310" stroke="#8A7D6E" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="260" x2="200" y2="310" stroke="#8A7D6E" stroke-width="1" opacity="0.5"/>
  <line x1="300" y1="260" x2="300" y2="310" stroke="#8A7D6E" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="260" x2="400" y2="310" stroke="#8A7D6E" stroke-width="1" opacity="0.5"/>
  <!-- Road -->
  <rect x="0" y="308" width="500" height="72" fill="#505045"/>

  <!-- WALLET on footpath -->
  <rect x="190" y="280" width="45" height="30" rx="4" fill="#1A1A1A"/>
  <rect x="193" y="283" width="39" height="24" rx="3" fill="#2A2A2A"/>
  <!-- Wallet detail - clasp -->
  <rect x="209" y="290" width="14" height="10" rx="2" fill="#444"/>
  <circle cx="216" cy="295" r="3" fill="#888"/>

  <!-- Glow / attention around wallet -->
  <circle cx="212" cy="295" r="35" fill="none" stroke="#FFD700" stroke-width="3" opacity="0.6" stroke-dasharray="5,5"/>
  <circle cx="212" cy="295" r="45" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.35" stroke-dasharray="8,5"/>

  <!-- SARAH - stopped, leaning forward looking down -->
  <!-- Shadow -->
  <ellipse cx="310" cy="318" rx="25" ry="7" fill="rgba(0,0,0,0.18)"/>
  <!-- Legs -->
  <line x1="300" y1="285" x2="294" y2="315" stroke="#2E5CA8" stroke-width="8" stroke-linecap="round"/>
  <line x1="320" y1="285" x2="326" y2="313" stroke="#2E5CA8" stroke-width="8" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="292" cy="318" rx="9" ry="4.5" fill="#222"/>
  <ellipse cx="328" cy="316" rx="9" ry="4.5" fill="#222"/>
  <!-- Body - leaning slightly -->
  <rect x="293" y="240" width="40" height="50" rx="6" fill="#E8506A" transform="rotate(-8 313 265)"/>
  <!-- Arm pointing down -->
  <line x1="293" y1="255" x2="240" y2="285" stroke="#FDDBB4" stroke-width="7" stroke-linecap="round"/>
  <line x1="333" y1="255" x2="340" y2="272" stroke="#FDDBB4" stroke-width="7" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="307" y="226" width="14" height="16" rx="4" fill="#FDDBB4"/>
  <!-- Head - tilted down -->
  <ellipse cx="314" cy="215" rx="22" ry="24" fill="#FDDBB4" transform="rotate(10 314 215)"/>
  <!-- Hair -->
  <ellipse cx="314" cy="198" rx="22" ry="11" fill="#5C3317"/>
  <ellipse cx="294" cy="208" rx="8" ry="14" fill="#5C3317"/>
  <ellipse cx="334" cy="208" rx="8" ry="14" fill="#5C3317"/>
  <!-- Eyes wide open - surprised -->
  <ellipse cx="308" cy="213" rx="4" ry="4.5" fill="white"/>
  <ellipse cx="322" cy="213" rx="4" ry="4.5" fill="white"/>
  <circle cx="309" cy="214" r="2.5" fill="#333"/>
  <circle cx="323" cy="214" r="2.5" fill="#333"/>
  <!-- Raised eyebrows (surprise) -->
  <path d="M 304 206 Q 310 202 315 206" stroke="#5C3317" stroke-width="2" fill="none"/>
  <path d="M 319 206 Q 325 202 330 206" stroke="#5C3317" stroke-width="2" fill="none"/>
  <!-- Open mouth (surprise) -->
  <ellipse cx="315" cy="224" rx="5" ry="4" fill="#B05050"/>

  <!-- Dotted line: eye gaze to wallet -->
  <line x1="255" y1="285" x2="212" y2="293" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Exclamation marks -->
  <text x="155" y="248" font-family="Arial" font-size="28" font-weight="bold" fill="#FF4500" opacity="0.85">!</text>
  <text x="178" y="248" font-family="Arial" font-size="28" font-weight="bold" fill="#FF4500" opacity="0.7">!</text>

  <!-- Caption -->
  <rect x="0" y="345" width="500" height="35" fill="rgba(0,0,0,0.65)"/>
  <text x="250" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">Picture 2: Suddenly, she saw something on the footpath.</text>
  <text x="250" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">It was a black wallet!</text>
</svg>
