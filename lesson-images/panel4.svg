<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <!-- Background - warm indoor/close-up feel -->
  <rect width="500" height="380" fill="#F2EDE4"/>

  <!-- Hand holding licence -->
  <ellipse cx="250" cy="345" rx="90" ry="28" fill="#FDDBB4"/>
  <ellipse cx="180" cy="318" rx="14" ry="28" fill="#FDDBB4" transform="rotate(-12 180 318)"/>
  <ellipse cx="202" cy="310" rx="13" ry="28" fill="#FDDBB4" transform="rotate(-5 202 310)"/>
  <ellipse cx="225" cy="307" rx="13" ry="27" fill="#FDDBB4" transform="rotate(1 225 307)"/>
  <ellipse cx="248" cy="308" rx="13" ry="26" fill="#FDDBB4" transform="rotate(6 248 308)"/>
  <!-- Thumb -->
  <ellipse cx="168" cy="338" rx="15" ry="11" fill="#FDDBB4" transform="rotate(-25 168 338)"/>

  <!-- Driver's Licence - large, detailed -->
  <rect x="55" y="80" width="390" height="235" rx="14" fill="#EDE0C0" filter="url(#dropshadow)"/>

  <!-- Drop shadow filter -->
  <defs>
    <filter id="dropshadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <rect x="55" y="80" width="390" height="235" rx="14" fill="#F0E8D0"/>

  <!-- NZ Licence header strip -->
  <rect x="55" y="80" width="390" height="42" rx="14" fill="#003F6B"/>
  <rect x="55" y="108" width="390" height="14" fill="#003F6B"/>
  <!-- Silver fern / NZ emblem area -->
  <text x="85" y="107" font-family="Arial" font-size="10" fill="#7BBFEA">🇳🇿</text>
  <text x="250" y="107" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white" letter-spacing="2">NEW ZEALAND</text>
  <text x="250" y="120" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#C8DFEF" letter-spacing="3">DRIVER LICENCE</text>
  <text x="415" y="107" text-anchor="end" font-family="Arial" font-size="9" fill="#7BBFEA">WAKA KOTAHI</text>

  <!-- Photo box -->
  <rect x="72" y="135" width="105" height="130" rx="6" fill="#D4C8B0"/>
  <rect x="75" y="138" width="99" height="124" rx="5" fill="#C8BBAA"/>
  <!-- Cartoon photo of Mr Patel -->
  <!-- Background of photo -->
  <rect x="75" y="138" width="99" height="124" rx="5" fill="#E8E0D0"/>
  <!-- Body in photo -->
  <rect x="96" y="210" width="58" height="52" rx="8" fill="#6B4E3D"/>
  <!-- Neck -->
  <rect x="116" y="200" width="16" height="15" rx="4" fill="#C8956A"/>
  <!-- Head - elderly man -->
  <ellipse cx="124" cy="185" rx="28" ry="30" fill="#C8956A"/>
  <!-- White/grey hair -->
  <ellipse cx="124" cy="160" rx="28" ry="12" fill="#D8D8D8"/>
  <ellipse cx="100" cy="172" rx="8" ry="14" fill="#D0D0D0"/>
  <ellipse cx="148" cy="172" rx="8" ry="14" fill="#D0D0D0"/>
  <!-- Glasses -->
  <ellipse cx="115" cy="184" rx="10" ry="8" fill="none" stroke="#555" stroke-width="2"/>
  <ellipse cx="133" cy="184" rx="10" ry="8" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="125" y1="184" x2="123" y2="184" stroke="#555" stroke-width="2"/>
  <line x1="105" y1="184" x2="98" y2="182" stroke="#555" stroke-width="2"/>
  <line x1="143" y1="184" x2="150" y2="182" stroke="#555" stroke-width="2"/>
  <!-- Eyes behind glasses -->
  <ellipse cx="115" cy="184" rx="7" ry="6" fill="white"/>
  <ellipse cx="133" cy="184" rx="7" ry="6" fill="white"/>
  <circle cx="115" cy="185" r="3" fill="#3A2A1A"/>
  <circle cx="133" cy="185" r="3" fill="#3A2A1A"/>
  <!-- Eyebrows - thick, grey -->
  <path d="M 107 174 Q 115 170 122 174" stroke="#888" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 126 174 Q 133 170 141 174" stroke="#888" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Neutral expression -->
  <path d="M 113 197 Q 124 202 134 197" stroke="#A07060" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- PHOTO label -->
  <text x="124" y="268" text-anchor="middle" font-family="Arial" font-size="8" fill="#666">PHOTO</text>

  <!-- LICENCE text details - right of photo -->
  <text x="192" y="150" font-family="Arial" font-size="10" fill="#777">Licence No:</text>
  <text x="278" y="150" font-family="Arial" font-size="10" font-weight="bold" fill="#222">NZ-4-82950</text>

  <text x="192" y="172" font-family="Arial" font-size="11" fill="#555">Surname:</text>
  <text x="270" y="172" font-family="Arial Black, Arial" font-size="14" font-weight="bold" fill="#111">PATEL</text>

  <text x="192" y="194" font-family="Arial" font-size="11" fill="#555">First name:</text>
  <text x="282" y="194" font-family="Arial Black, Arial" font-size="13" font-weight="bold" fill="#111">Rajesh</text>

  <text x="192" y="216" font-family="Arial" font-size="11" fill="#555">Date of birth:</text>
  <text x="295" y="216" font-family="Arial" font-size="11" font-weight="bold" fill="#222">12/04/1950</text>

  <!-- ADDRESS highlighted -->
  <rect x="185" y="228" width="248" height="60" rx="6" fill="#FFF8E0" stroke="#F0C030" stroke-width="2"/>
  <text x="192" y="246" font-family="Arial" font-size="11" fill="#555">Address:</text>
  <text x="192" y="264" font-family="Arial Black, Arial" font-size="15" font-weight="bold" fill="#111">24 Valley Road</text>
  <text x="192" y="281" font-family="Arial Black, Arial" font-size="14" font-weight="bold" fill="#111">Mt Eden, Auckland</text>

  <!-- Highlight annotation arrow -->
  <path d="M 440 258 Q 470 240 475 200" stroke="#E05000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="475,200 465,212 480,212" fill="#E05000"/>
  <text x="445" y="192" font-family="Arial" font-size="12" font-weight="bold" fill="#E05000">Address!</text>

  <!-- Expiry / class -->
  <text x="192" y="302" font-family="Arial" font-size="9" fill="#888">Class: 1   Expires: 12/04/2026</text>

  <!-- Barcode strip -->
  <rect x="72" y="292" width="370" height="15" rx="3" fill="#EEE8D8"/>
  <text x="257" y="303" text-anchor="middle" font-family="Courier" font-size="7" fill="#888" letter-spacing="1">||||||||||||||||||||||||||||||||||||||||||||||||||||||</text>

  <!-- Caption -->
  <rect x="0" y="345" width="500" height="35" fill="rgba(0,0,0,0.65)"/>
  <text x="250" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">Picture 4: The licence had a name and an address:</text>
  <text x="250" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">Mr Patel, 24 Valley Road, Mt Eden.</text>
</svg>
