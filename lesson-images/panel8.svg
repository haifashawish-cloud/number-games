<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <!-- Indoor cozy scene - tea and cake -->
  <!-- Room walls -->
  <rect width="500" height="380" fill="#F5EDD8"/>
  <!-- Wall colour upper -->
  <rect width="500" height="200" fill="#E8D8B8"/>
  <!-- Floor -->
  <rect x="0" y="280" width="500" height="100" fill="#C09060"/>
  <!-- Floor boards -->
  <line x1="0" y1="295" x2="500" y2="295" stroke="#A87848" stroke-width="1.5"/>
  <line x1="0" y1="315" x2="500" y2="315" stroke="#A87848" stroke-width="1.5"/>
  <line x1="0" y1="335" x2="500" y2="335" stroke="#A87848" stroke-width="1.5"/>
  <line x1="0" y1="355" x2="500" y2="355" stroke="#A87848" stroke-width="1.5"/>
  <line x1="80" y1="280" x2="80" y2="380" stroke="#A87848" stroke-width="1"/>
  <line x1="175" y1="280" x2="175" y2="380" stroke="#A87848" stroke-width="1"/>
  <line x1="270" y1="280" x2="270" y2="380" stroke="#A87848" stroke-width="1"/>
  <line x1="365" y1="280" x2="365" y2="380" stroke="#A87848" stroke-width="1"/>
  <line x1="455" y1="280" x2="455" y2="380" stroke="#A87848" stroke-width="1"/>

  <!-- Skirting board -->
  <rect x="0" y="278" width="500" height="6" fill="#8B6040"/>

  <!-- Wall picture frame -->
  <rect x="190" y="20" width="120" height="90" rx="4" fill="#8B6030"/>
  <rect x="195" y="25" width="110" height="80" rx="3" fill="#D4C8A8"/>
  <!-- Landscape in frame -->
  <rect x="197" y="27" width="106" height="76" rx="2" fill="#88AACC"/>
  <ellipse cx="250" cy="68" rx="40" ry="28" fill="#88B060"/>
  <ellipse cx="215" cy="75" rx="28" ry="20" fill="#6A9040"/>
  <ellipse cx="280" cy="72" rx="25" ry="18" fill="#78A050"/>
  <circle cx="300" cy="40" rx="16" ry="16" fill="#FFD070"/>

  <!-- Lamp on side table -->
  <rect x="430" y="148" width="12" height="80" fill="#8B6030"/>
  <ellipse cx="436" cy="144" rx="30" ry="16" fill="#F0D880"/>
  <ellipse cx="436" cy="136" rx="20" ry="10" fill="#FFFACC"/>
  <!-- Lamp glow -->
  <ellipse cx="436" cy="160" rx="40" ry="30" fill="#FFE890" opacity="0.25"/>
  <rect x="415" y="225" width="50" height="12" rx="3" fill="#6B4020"/>
  <rect x="418" y="237" width="8" height="45" fill="#6B4020"/>
  <rect x="455" y="237" width="8" height="45" fill="#6B4020"/>

  <!-- Bookshelf on left wall -->
  <rect x="0" y="100" width="90" height="180" rx="3" fill="#8B6030"/>
  <rect x="5" y="105" width="80" height="170" rx="2" fill="#7A5028"/>
  <!-- Books -->
  <rect x="8" y="108" width="12" height="55" fill="#4A8A4A"/>
  <rect x="21" y="108" width="10" height="55" fill="#8A4A2A"/>
  <rect x="32" y="108" width="14" height="55" fill="#2A5A8A"/>
  <rect x="47" y="108" width="11" height="55" fill="#8A8A2A"/>
  <rect x="59" y="108" width="13" height="55" fill="#6A2A8A"/>
  <rect x="73" y="108" width="9" height="55" fill="#AA4444"/>
  <rect x="8" y="170" width="74" height="4" fill="#5A3818"/>
  <rect x="8" y="176" width="13" height="60" fill="#3A6A9A"/>
  <rect x="22" y="176" width="11" height="60" fill="#8A3A5A"/>
  <rect x="34" y="176" width="15" height="60" fill="#4A7A4A"/>
  <rect x="50" y="176" width="10" height="60" fill="#9A7A2A"/>
  <rect x="61" y="176" width="14" height="60" fill="#7A2A4A"/>
  <rect x="76" y="176" width="9" height="60" fill="#3A5A8A"/>

  <!-- TABLE - rectangular dining table -->
  <ellipse cx="250" cy="295" rx="180" ry="25" fill="#7A5030" opacity="0.3"/>
  <rect x="100" y="255" width="300" height="30" rx="8" fill="#A06830"/>
  <rect x="108" y="260" width="284" height="20" rx="6" fill="#B07840"/>
  <!-- Table legs -->
  <rect x="110" y="280" width="14" height="60" rx="4" fill="#8B5C28"/>
  <rect x="375" y="280" width="14" height="60" rx="4" fill="#8B5C28"/>
  <rect x="130" y="280" width="10" height="55" rx="3" fill="#7A5020" opacity="0.5"/>
  <rect x="360" y="280" width="10" height="55" rx="3" fill="#7A5020" opacity="0.5"/>

  <!-- TABLECLOTH hint -->
  <rect x="102" y="255" width="296" height="32" rx="8" fill="#F0E0D0" opacity="0.3"/>

  <!-- TABLE ITEMS -->
  <!-- Teapot -->
  <ellipse cx="250" cy="252" rx="28" ry="18" fill="#A04020"/>
  <ellipse cx="250" cy="244" rx="22" ry="12" fill="#B85030"/>
  <path d="M 278 250 Q 295 248 292 260 Q 290 268 278 262" fill="#A04020"/>
  <path d="M 222 248 Q 206 246 208 256" stroke="#A04020" stroke-width="4" fill="none"/>
  <ellipse cx="250" cy="242" rx="8" ry="5" fill="#C86040"/>
  <circle cx="250" cy="238" r="4" fill="#CC6040"/>
  <!-- Steam from teapot -->
  <path d="M 244 232 Q 242 220 246 215 Q 250 210 248 200" stroke="#DDD" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 253 230 Q 255 220 251 214 Q 248 208 252 200" stroke="#DDD" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Sarah's teacup -->
  <ellipse cx="175" cy="265" rx="18" ry="8" fill="#F0E0C8"/>
  <ellipse cx="175" cy="260" rx="16" ry="10" fill="#F8F0E0"/>
  <!-- Tea in cup -->
  <ellipse cx="175" cy="258" rx="12" ry="6" fill="#C08040" opacity="0.7"/>
  <!-- Cup handle -->
  <path d="M 191 258 Q 200 258 200 265 Q 200 272 191 270" stroke="#E8D8B8" stroke-width="3" fill="none"/>
  <!-- Saucer -->
  <ellipse cx="175" cy="268" rx="22" ry="6" fill="#EEE0C0"/>

  <!-- Mr Patel's teacup -->
  <ellipse cx="325" cy="265" rx="18" ry="8" fill="#F0E0C8"/>
  <ellipse cx="325" cy="260" rx="16" ry="10" fill="#F8F0E0"/>
  <ellipse cx="325" cy="258" rx="12" ry="6" fill="#C08040" opacity="0.7"/>
  <path d="M 341 258 Q 350 258 350 265 Q 350 272 341 270" stroke="#E8D8B8" stroke-width="3" fill="none"/>
  <ellipse cx="325" cy="268" rx="22" ry="6" fill="#EEE0C0"/>

  <!-- Cake plate -->
  <ellipse cx="250" cy="270" rx="35" ry="10" fill="#F0E8D0"/>
  <!-- Cake slice -->
  <polygon points="235,265 265,265 258,248 242,248" fill="#F0C060"/>
  <!-- Cake layers -->
  <rect x="235" y="260" width="30" height="5" fill="#E8885C"/>
  <rect x="237" y="248" width="26" height="5" fill="#F0C060"/>
  <!-- Icing on top -->
  <rect x="237" y="248" width="26" height="4" rx="2" fill="white"/>
  <circle cx="250" cy="247" r="3" fill="#FF6688"/>

  <!-- Biscuits/cookies on plate -->
  <ellipse cx="210" cy="270" rx="12" ry="5" fill="#E8C87A"/>
  <ellipse cx="210" cy="268" rx="10" ry="4" fill="#F0D888"/>
  <ellipse cx="228" cy="272" rx="11" ry="4" fill="#E8C070"/>

  <!-- ====== SARAH - seated left ====== -->
  <!-- Body seated - lower portion -->
  <rect x="118" y="280" width="50" height="35" rx="5" fill="#2E5CA8"/> <!-- lap/legs -->
  <rect x="115" y="240" width="55" height="46" rx="8" fill="#E8506A"/> <!-- body -->
  <!-- Arm reaching for cup -->
  <line x1="115" y1="255" x2="145" y2="265" stroke="#FDDBB4" stroke-width="7" stroke-linecap="round"/>
  <!-- Other arm - gesturing, talking -->
  <line x1="170" y1="255" x2="182" y2="238" stroke="#FDDBB4" stroke-width="7" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="132" y="228" width="13" height="15" rx="4" fill="#FDDBB4"/>
  <!-- Head -->
  <ellipse cx="138" cy="214" rx="24" ry="26" fill="#FDDBB4"/>
  <!-- Hair -->
  <ellipse cx="138" cy="193" rx="24" ry="12" fill="#5C3317"/>
  <ellipse cx="117" cy="207" rx="8" ry="15" fill="#5C3317"/>
  <ellipse cx="159" cy="207" rx="8" ry="15" fill="#5C3317"/>
  <!-- Happy eyes -->
  <path d="M 129 211 Q 132 207 136 211" stroke="#333" stroke-width="2.5" fill="none"/>
  <path d="M 140 211 Q 143 207 147 211" stroke="#333" stroke-width="2.5" fill="none"/>
  <!-- Big smile - she's talking happily -->
  <path d="M 129 224 Q 138 233 148 224" stroke="#C07050" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="127" cy="222" r="7" fill="#FFB0A0" opacity="0.5"/>
  <circle cx="150" cy="222" r="7" fill="#FFB0A0" opacity="0.5"/>

  <!-- Sarah's speech bubble -->
  <rect x="5" y="155" width="108" height="52" rx="12" fill="white" stroke="#DDD" stroke-width="1.5"/>
  <polygon points="100,205 112,220 95,205" fill="white" stroke="#DDD" stroke-width="1.5"/>
  <line x1="95" y1="205" x2="100" y2="205" stroke="white" stroke-width="3"/>
  <text x="59" y="175" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333" font-style="italic">"Do you live</text>
  <text x="59" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333" font-style="italic">in Mt Eden</text>
  <text x="59" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333" font-style="italic">long?"</text>

  <!-- ====== MR PATEL - seated right ====== -->
  <!-- Legs -->
  <rect x="332" y="280" width="50" height="35" rx="5" fill="#4A4A4A"/>
  <!-- Cardigan body -->
  <rect x="328" y="240" width="55" height="46" rx="8" fill="#5A5A7A"/>
  <!-- Arms - one holding cup, one gesturing -->
  <line x1="383" y1="255" x2="355" y2="265" stroke="#C8956A" stroke-width="8" stroke-linecap="round"/>
  <line x1="328" y1="256" x2="316" y2="240" stroke="#C8956A" stroke-width="8" stroke-linecap="round"/>
  <!-- Hand holding cup -->
  <ellipse cx="352" cy="267" rx="10" ry="7" fill="#C8956A"/>
  <!-- Neck -->
  <rect x="348" y="228" width="14" height="16" rx="4" fill="#C8956A"/>
  <!-- Head -->
  <ellipse cx="355" cy="213" rx="30" ry="31" fill="#C8956A"/>
  <!-- White hair -->
  <ellipse cx="355" cy="188" rx="28" ry="11" fill="#D8D8D8"/>
  <ellipse cx="329" cy="200" rx="8" ry="15" fill="#D0D0D0"/>
  <ellipse cx="381" cy="200" rx="8" ry="15" fill="#D0D0D0"/>
  <!-- Glasses -->
  <ellipse cx="343" cy="212" rx="12" ry="9" fill="none" stroke="#555" stroke-width="2.5"/>
  <ellipse cx="367" cy="212" rx="12" ry="9" fill="none" stroke="#555" stroke-width="2.5"/>
  <line x1="355" y1="212" x2="355" y2="212" stroke="#555" stroke-width="2.5"/>
  <line x1="331" y1="212" x2="323" y2="209" stroke="#555" stroke-width="2.5"/>
  <line x1="379" y1="212" x2="387" y2="209" stroke="#555" stroke-width="2.5"/>
  <!-- Happy eyes -->
  <path d="M 334 210 Q 343 205 352 210" stroke="#3A2A1A" stroke-width="2.5" fill="none"/>
  <path d="M 358 210 Q 367 205 376 210" stroke="#3A2A1A" stroke-width="2.5" fill="none"/>
  <!-- Warm smile -->
  <path d="M 340 228 Q 355 240 370 228" stroke="#A07060" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="337" cy="225" r="8" fill="#FFB090" opacity="0.5"/>
  <circle cx="374" cy="225" r="8" fill="#FFB090" opacity="0.5"/>

  <!-- Mr Patel speech bubble -->
  <rect x="385" y="148" width="110" height="62" rx="12" fill="white" stroke="#DDD" stroke-width="1.5"/>
  <polygon points="396,208 384,225 410,208" fill="white" stroke="#DDD" stroke-width="1.5"/>
  <line x1="396" y1="208" x2="410" y2="208" stroke="white" stroke-width="3"/>
  <text x="440" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333" font-style="italic">"I moved here</text>
  <text x="440" y="183" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333" font-style="italic">thirty years</text>
  <text x="440" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#333" font-style="italic">ago..."</text>

  <!-- Caption -->
  <rect x="0" y="345" width="500" height="35" fill="rgba(0,0,0,0.65)"/>
  <text x="250" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">Picture 8: Mr Patel made tea and cake.</text>
  <text x="250" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">They sat together and talked for an hour.</text>
</svg>
