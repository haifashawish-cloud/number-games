<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <!-- Outdoor doorstep scene - happy moment -->
  <rect width="500" height="380" fill="#A8D8F0"/>

  <!-- Sunny sky -->
  <rect width="500" height="200" fill="#87CEEB"/>
  <!-- Sun breaking through -->
  <circle cx="440" cy="60" r="40" fill="#FFD700" opacity="0.9"/>
  <!-- Sun rays -->
  <line x1="440" y1="12" x2="440" y2="5" stroke="#FFD700" stroke-width="3"/>
  <line x1="440" y1="108" x2="440" y2="115" stroke="#FFD700" stroke-width="3"/>
  <line x1="392" y1="60" x2="385" y2="60" stroke="#FFD700" stroke-width="3"/>
  <line x1="488" y1="60" x2="495" y2="60" stroke="#FFD700" stroke-width="3"/>
  <line x1="406" y1="26" x2="401" y2="21" stroke="#FFD700" stroke-width="3"/>
  <line x1="474" y1="94" x2="479" y2="99" stroke="#FFD700" stroke-width="3"/>
  <line x1="406" y1="94" x2="401" y2="99" stroke="#FFD700" stroke-width="3"/>
  <line x1="474" y1="26" x2="479" y2="21" stroke="#FFD700" stroke-width="3"/>

  <!-- White clouds -->
  <ellipse cx="80" cy="55" rx="50" ry="25" fill="white" opacity="0.85"/>
  <ellipse cx="120" cy="48" rx="38" ry="22" fill="white" opacity="0.85"/>
  <ellipse cx="230" cy="45" rx="40" ry="20" fill="white" opacity="0.75"/>

  <!-- House wall -->
  <rect x="0" y="140" width="500" height="240" fill="#DDB882"/>
  <!-- Brick pattern subtle -->
  <line x1="0" y1="165" x2="500" y2="165" stroke="#C8A870" stroke-width="0.8" opacity="0.35"/>
  <line x1="0" y1="195" x2="500" y2="195" stroke="#C8A870" stroke-width="0.8" opacity="0.35"/>
  <line x1="0" y1="225" x2="500" y2="225" stroke="#C8A870" stroke-width="0.8" opacity="0.35"/>
  <line x1="0" y1="255" x2="500" y2="255" stroke="#C8A870" stroke-width="0.8" opacity="0.35"/>
  <line x1="0" y1="285" x2="500" y2="285" stroke="#C8A870" stroke-width="0.8" opacity="0.35"/>
  <line x1="0" y1="315" x2="500" y2="315" stroke="#C8A870" stroke-width="0.8" opacity="0.35"/>

  <!-- Roof edge -->
  <rect x="0" y="135" width="500" height="18" fill="#8B4513"/>

  <!-- Open door - open inward -->
  <rect x="355" y="148" width="120" height="232" rx="5" fill="#2A1808" opacity="0.8"/>
  <!-- Door frame -->
  <rect x="348" y="143" width="135" height="237" rx="6" fill="none" stroke="#6B4020" stroke-width="10"/>
  <!-- Warm interior glow -->
  <rect x="360" y="152" width="110" height="225" fill="#3A2010"/>
  <ellipse cx="415" cy="260" rx="55" ry="70" fill="#C08040" opacity="0.35"/>

  <!-- Door itself open to side -->
  <rect x="348" y="143" width="8" height="237" fill="#5C3818"/>

  <!-- Doorstep -->
  <rect x="280" y="370" width="200" height="10" rx="2" fill="#A08060"/>
  <rect x="290" y="360" width="180" height="15" rx="3" fill="#B09070"/>

  <!-- Window left -->
  <rect x="30" y="162" width="115" height="100" rx="4" fill="#A8C8E8"/>
  <line x1="87" y1="162" x2="87" y2="262" stroke="#888" stroke-width="4"/>
  <line x1="30" y1="212" x2="145" y2="212" stroke="#888" stroke-width="4"/>
  <rect x="30" y="162" width="115" height="100" rx="4" fill="none" stroke="#8B6030" stroke-width="6"/>

  <!-- Potted plant by door -->
  <rect x="330" y="330" width="20" height="30" rx="4" fill="#8B4513"/>
  <ellipse cx="340" cy="325" rx="22" ry="18" fill="#3A8020"/>
  <ellipse cx="328" cy="320" rx="14" ry="12" fill="#4A9030"/>

  <!-- ====== SARAH - right side ====== -->
  <!-- Shadow -->
  <ellipse cx="255" cy="363" rx="28" ry="7" fill="rgba(0,0,0,0.15)"/>
  <!-- Legs -->
  <line x1="244" y1="310" x2="240" y2="355" stroke="#2E5CA8" stroke-width="9" stroke-linecap="round"/>
  <line x1="264" y1="310" x2="268" y2="353" stroke="#2E5CA8" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="237" cy="358" rx="10" ry="5" fill="#222"/>
  <ellipse cx="270" cy="356" rx="10" ry="5" fill="#222"/>
  <!-- Body -->
  <rect x="235" y="260" width="46" height="56" rx="7" fill="#E8506A"/>
  <!-- Arm extending wallet -->
  <line x1="235" y1="272" x2="310" y2="278" stroke="#FDDBB4" stroke-width="8" stroke-linecap="round"/>
  <!-- Other arm -->
  <line x1="281" y1="272" x2="290" y2="295" stroke="#FDDBB4" stroke-width="8" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="249" y="248" width="14" height="16" rx="4" fill="#FDDBB4"/>
  <!-- Head -->
  <ellipse cx="256" cy="233" rx="24" ry="26" fill="#FDDBB4"/>
  <!-- Hair -->
  <ellipse cx="256" cy="213" rx="24" ry="12" fill="#5C3317"/>
  <ellipse cx="235" cy="226" rx="8" ry="15" fill="#5C3317"/>
  <ellipse cx="277" cy="226" rx="8" ry="15" fill="#5C3317"/>
  <!-- Happy eyes -->
  <path d="M 247 230 Q 250 226 254 230" stroke="#333" stroke-width="2.5" fill="none"/> <!-- happy eye squint left -->
  <path d="M 258 230 Q 261 226 265 230" stroke="#333" stroke-width="2.5" fill="none"/> <!-- happy eye squint right -->
  <!-- Big smile -->
  <path d="M 246 242 Q 256 252 266 242" stroke="#C07050" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="244" cy="241" r="7" fill="#FFB0A0" opacity="0.5"/>
  <circle cx="268" cy="241" r="7" fill="#FFB0A0" opacity="0.5"/>

  <!-- WALLET in Sarah's extended hand -->
  <rect x="308" y="270" width="40" height="27" rx="4" fill="#1A1A1A"/>
  <rect x="311" y="273" width="34" height="21" rx="3" fill="#2A2A2A"/>
  <rect x="318" y="278" width="14" height="10" rx="2" fill="#444"/>
  <circle cx="325" cy="283" r="3" fill="#888"/>

  <!-- Hand holding wallet -->
  <ellipse cx="315" cy="283" rx="12" ry="8" fill="#FDDBB4"/>

  <!-- ====== MR PATEL - left side ====== -->
  <!-- Shadow -->
  <ellipse cx="380" cy="365" rx="28" ry="7" fill="rgba(0,0,0,0.15)"/>
  <!-- Legs -->
  <line x1="370" y1="308" x2="366" y2="352" stroke="#4A4A4A" stroke-width="9" stroke-linecap="round"/>
  <line x1="390" y1="308" x2="394" y2="350" stroke="#4A4A4A" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="363" cy="355" rx="10" ry="5" fill="#222"/>
  <ellipse cx="396" cy="353" rx="10" ry="5" fill="#222"/>
  <!-- Cardigan -->
  <rect x="358" y="258" width="48" height="56" rx="7" fill="#5A5A7A"/>
  <!-- Arms - reaching for wallet with both hands raised in gratitude -->
  <line x1="358" y1="270" x2="330" y2="280" stroke="#C8956A" stroke-width="8" stroke-linecap="round"/>
  <!-- Hand taking wallet -->
  <ellipse cx="328" cy="283" rx="11" ry="8" fill="#C8956A"/>
  <line x1="406" y1="270" x2="420" y2="285" stroke="#C8956A" stroke-width="8" stroke-linecap="round"/>
  <circle cx="422" cy="288" r="9" fill="#C8956A"/>
  <!-- Neck -->
  <rect x="373" y="244" width="14" height="18" rx="4" fill="#C8956A"/>
  <!-- Head -->
  <ellipse cx="380" cy="228" rx="30" ry="32" fill="#C8956A"/>
  <!-- White hair -->
  <ellipse cx="380" cy="202" rx="28" ry="11" fill="#D8D8D8"/>
  <ellipse cx="354" cy="213" rx="8" ry="16" fill="#D0D0D0"/>
  <ellipse cx="406" cy="213" rx="8" ry="16" fill="#D0D0D0"/>
  <!-- Glasses -->
  <ellipse cx="368" cy="226" rx="12" ry="9" fill="none" stroke="#555" stroke-width="2.5"/>
  <ellipse cx="392" cy="226" rx="12" ry="9" fill="none" stroke="#555" stroke-width="2.5"/>
  <line x1="380" y1="226" x2="380" y2="226" stroke="#555" stroke-width="2.5"/>
  <line x1="356" y1="226" x2="348" y2="223" stroke="#555" stroke-width="2.5"/>
  <line x1="404" y1="226" x2="412" y2="223" stroke="#555" stroke-width="2.5"/>
  <!-- Crinkled HAPPY eyes -->
  <path d="M 359 224 Q 368 219 377 224" stroke="#3A2A1A" stroke-width="2.5" fill="none"/>
  <path d="M 383 224 Q 392 219 401 224" stroke="#3A2A1A" stroke-width="2.5" fill="none"/>
  <!-- Big smile / happy -->
  <path d="M 364 242 Q 380 255 396 242" stroke="#A07060" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cheeks happy -->
  <circle cx="360" cy="240" r="8" fill="#FFB090" opacity="0.5"/>
  <circle cx="400" cy="240" r="8" fill="#FFB090" opacity="0.5"/>
  <!-- Happiness lines around eyes -->
  <path d="M 380 210 L 382 203" stroke="#C8956A" stroke-width="1.5" opacity="0.6"/>
  <path d="M 372 212 L 370 205" stroke="#C8956A" stroke-width="1.5" opacity="0.6"/>
  <path d="M 388 212 L 390 205" stroke="#C8956A" stroke-width="1.5" opacity="0.6"/>

  <!-- "Thank you!" speech bubble from Mr Patel -->
  <rect x="415" y="165" width="78" height="52" rx="14" fill="white" stroke="#CCC" stroke-width="2"/>
  <polygon points="415,205 400,220 425,205" fill="white" stroke="#CCC" stroke-width="2"/>
  <!-- cover triangle seam -->
  <line x1="415" y1="205" x2="425" y2="205" stroke="white" stroke-width="3"/>
  <text x="454" y="188" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2A2A2A">Thank you,</text>
  <text x="454" y="206" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2A2A2A">thank you!</text>

  <!-- Hearts / happiness sparkles -->
  <text x="290" y="215" font-family="Arial" font-size="20" fill="#FF6688" opacity="0.8">♥</text>
  <text x="315" y="205" font-family="Arial" font-size="14" fill="#FF6688" opacity="0.6">♥</text>
  <text x="270" y="230" font-family="Arial" font-size="12" fill="#FF6688" opacity="0.5">♥</text>

  <!-- Caption -->
  <rect x="0" y="345" width="500" height="35" fill="rgba(0,0,0,0.65)"/>
  <text x="250" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">Picture 7: Sarah gave him the wallet.</text>
  <text x="250" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">Mr Patel smiled and said, "Thank you, thank you!"</text>
</svg>
