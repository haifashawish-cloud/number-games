<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="500" height="380">
  <!-- Sky -->
  <rect width="500" height="380" fill="#87CEEB"/>
  <!-- Sun -->
  <circle cx="420" cy="55" r="38" fill="#FFD700"/>
  <line x1="420" y1="5" x2="420" y2="0" stroke="#FFD700" stroke-width="3"/>
  <line x1="420" y1="105" x2="420" y2="110" stroke="#FFD700" stroke-width="3"/>
  <line x1="370" y1="55" x2="365" y2="55" stroke="#FFD700" stroke-width="3"/>
  <line x1="470" y1="55" x2="475" y2="55" stroke="#FFD700" stroke-width="3"/>
  <line x1="385" y1="20" x2="382" y2="17" stroke="#FFD700" stroke-width="3"/>
  <line x1="455" y1="90" x2="458" y2="93" stroke="#FFD700" stroke-width="3"/>
  <line x1="385" y1="90" x2="382" y2="93" stroke="#FFD700" stroke-width="3"/>
  <line x1="455" y1="20" x2="458" y2="17" stroke="#FFD700" stroke-width="3"/>

  <!-- Buildings background -->
  <rect x="0" y="60" width="90" height="200" fill="#9B8EA0"/>
  <rect x="10" y="70" width="70" height="180" fill="#B0A0BC"/>
  <!-- Windows building 1 -->
  <rect x="20" y="85" width="15" height="18" fill="#E8F4FD" rx="2"/>
  <rect x="45" y="85" width="15" height="18" fill="#E8F4FD" rx="2"/>
  <rect x="20" y="115" width="15" height="18" fill="#E8F4FD" rx="2"/>
  <rect x="45" y="115" width="15" height="18" fill="#E8F4FD" rx="2"/>
  <rect x="20" y="145" width="15" height="18" fill="#E8F4FD" rx="2"/>
  <rect x="45" y="145" width="15" height="18" fill="#E8F4FD" rx="2"/>
  <rect x="20" y="175" width="15" height="18" fill="#E8F4FD" rx="2"/>
  <rect x="45" y="175" width="15" height="18" fill="#E8F4FD" rx="2"/>

  <rect x="100" y="30" width="110" height="230" fill="#8B7D8E"/>
  <rect x="115" y="45" width="80" height="200" fill="#A08CA5"/>
  <!-- Windows building 2 -->
  <rect x="125" y="60" width="18" height="20" fill="#B8D4E8" rx="2"/>
  <rect x="155" y="60" width="18" height="20" fill="#B8D4E8" rx="2"/>
  <rect x="125" y="92" width="18" height="20" fill="#B8D4E8" rx="2"/>
  <rect x="155" y="92" width="18" height="20" fill="#B8D4E8" rx="2"/>
  <rect x="125" y="124" width="18" height="20" fill="#B8D4E8" rx="2"/>
  <rect x="155" y="124" width="18" height="20" fill="#B8D4E8" rx="2"/>
  <rect x="125" y="156" width="18" height="20" fill="#B8D4E8" rx="2"/>
  <rect x="155" y="156" width="18" height="20" fill="#B8D4E8" rx="2"/>

  <rect x="230" y="50" width="130" height="210" fill="#9E8FA8"/>
  <rect x="248" y="65" width="95" height="185" fill="#B09AB8"/>
  <!-- Windows building 3 -->
  <rect x="260" y="80" width="20" height="22" fill="#C8E0F0" rx="2"/>
  <rect x="295" y="80" width="20" height="22" fill="#C8E0F0" rx="2"/>
  <rect x="260" y="115" width="20" height="22" fill="#C8E0F0" rx="2"/>
  <rect x="295" y="115" width="20" height="22" fill="#C8E0F0" rx="2"/>
  <rect x="260" y="150" width="20" height="22" fill="#C8E0F0" rx="2"/>
  <rect x="295" y="150" width="20" height="22" fill="#C8E0F0" rx="2"/>
  <rect x="260" y="185" width="20" height="22" fill="#C8E0F0" rx="2"/>
  <rect x="295" y="185" width="20" height="22" fill="#C8E0F0" rx="2"/>

  <rect x="380" y="70" width="120" height="190" fill="#8A7C90"/>
  <rect x="395" y="85" width="90" height="170" fill="#9E8EA8"/>
  <!-- Windows building 4 -->
  <rect x="405" y="100" width="18" height="20" fill="#D0E8F5" rx="2"/>
  <rect x="433" y="100" width="18" height="20" fill="#D0E8F5" rx="2"/>
  <rect x="405" y="132" width="18" height="20" fill="#D0E8F5" rx="2"/>
  <rect x="433" y="132" width="18" height="20" fill="#D0E8F5" rx="2"/>
  <rect x="405" y="164" width="18" height="20" fill="#D0E8F5" rx="2"/>
  <rect x="433" y="164" width="18" height="20" fill="#D0E8F5" rx="2"/>

  <!-- Footpath / Sidewalk -->
  <rect x="0" y="260" width="500" height="120" fill="#8B8070"/>
  <!-- Sidewalk lines -->
  <line x1="0" y1="280" x2="500" y2="280" stroke="#7A6F60" stroke-width="1.5" stroke-dasharray="20,10"/>
  <!-- Road -->
  <rect x="0" y="310" width="500" height="70" fill="#555045"/>
  <!-- Road markings -->
  <line x1="0" y1="345" x2="500" y2="345" stroke="#FFD700" stroke-width="2" stroke-dasharray="30,15"/>

  <!-- Shops at base of buildings -->
  <rect x="0" y="230" width="100" height="35" fill="#8B4513"/>
  <rect x="5" y="232" width="90" height="30" fill="#D2691E"/>
  <text x="50" y="252" text-anchor="middle" font-family="Arial" font-size="11" fill="white">CAFÉ</text>

  <rect x="110" y="225" width="120" height="40" fill="#2F4F2F"/>
  <rect x="115" y="227" width="110" height="36" fill="#3A6B3A"/>
  <text x="170" y="251" text-anchor="middle" font-family="Arial" font-size="11" fill="white">BOOKSHOP</text>

  <rect x="240" y="230" width="125" height="35" fill="#4A4090"/>
  <rect x="245" y="232" width="115" height="31" fill="#6050B0"/>
  <text x="302" y="252" text-anchor="middle" font-family="Arial" font-size="11" fill="white">PHARMACY</text>

  <!-- SARAH - woman walking -->
  <!-- Body -->
  <ellipse cx="320" cy="315" rx="18" ry="6" fill="rgba(0,0,0,0.15)"/> <!-- shadow -->
  <!-- Legs -->
  <line x1="310" y1="290" x2="305" y2="320" stroke="#2E5CA8" stroke-width="7" stroke-linecap="round"/>
  <line x1="325" y1="290" x2="332" y2="318" stroke="#2E5CA8" stroke-width="7" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="303" cy="322" rx="8" ry="4" fill="#333"/>
  <ellipse cx="334" cy="320" rx="8" ry="4" fill="#333"/>
  <!-- Dress/top -->
  <rect x="300" y="245" width="40" height="50" rx="6" fill="#E8506A"/>
  <!-- Arms -->
  <line x1="300" y1="258" x2="282" y2="278" stroke="#FDDBB4" stroke-width="6" stroke-linecap="round"/>
  <line x1="340" y1="258" x2="360" y2="268" stroke="#FDDBB4" stroke-width="6" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="313" y="232" width="14" height="16" rx="4" fill="#FDDBB4"/>
  <!-- Head -->
  <ellipse cx="320" cy="222" rx="22" ry="24" fill="#FDDBB4"/>
  <!-- Hair -->
  <ellipse cx="320" cy="205" rx="22" ry="12" fill="#5C3317"/>
  <ellipse cx="300" cy="215" rx="8" ry="14" fill="#5C3317"/>
  <ellipse cx="340" cy="215" rx="8" ry="14" fill="#5C3317"/>
  <!-- Eyes -->
  <ellipse cx="313" cy="220" rx="3.5" ry="3.5" fill="white"/>
  <ellipse cx="327" cy="220" rx="3.5" ry="3.5" fill="white"/>
  <circle cx="314" cy="221" r="2" fill="#333"/>
  <circle cx="328" cy="221" r="2" fill="#333"/>
  <!-- Smile -->
  <path d="M 313 230 Q 320 237 327 230" stroke="#C0704A" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Shopping bags -->
  <rect x="264" y="263" width="20" height="26" rx="3" fill="#2E8B57"/>
  <path d="M 268 263 Q 268 255 274 255 Q 280 255 280 263" stroke="#1A5C35" stroke-width="2" fill="none"/>
  <rect x="285" y="265" width="17" height="22" rx="3" fill="#8B1A3A"/>
  <path d="M 288 265 Q 288 258 293.5 258 Q 299 258 299 265" stroke="#5A0A20" stroke-width="2" fill="none"/>

  <!-- Caption box -->
  <rect x="0" y="345" width="500" height="35" fill="rgba(0,0,0,0.65)"/>
  <text x="250" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">Picture 1: It was a sunny Saturday afternoon.</text>
  <text x="250" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="white">Sarah was walking down Queen Street after shopping.</text>
</svg>
