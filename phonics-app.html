<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phonics App</title>
  <style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ============================================================
   VARIABLES  (spring palette, fixed)
   ============================================================ */
:root {
  --text:         #000000;
  --text-muted:   #555555;
  --card-bg:      #ffffff;
  --shadow:       0 3px 10px rgba(0,0,0,0.08);
  --shadow-hover: 0 8px 22px rgba(0,0,0,0.13);
  --radius:       18px;
  --transition:   0.22s ease;
  --bg:           #f2fce8;
  --header-bg:    #d6f5c0;
  --season-color: #6dbf45;
  --season-light: #c8f0a8;
  --tab-active:   #6dbf45;
  --card-hover:   #eefce3;
  --blend-chip:   #c8f0a8;
}

/* ============================================================
   GLOBAL
   ============================================================ */
body {
  font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ============================================================
   HEADER
   ============================================================ */
header {
  background: var(--header-bg);
  padding: 20px 24px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  border-bottom: 2px solid rgba(0,0,0,0.07);
}

h1 {
  font-size: 2rem;
  font-weight: 900;
  color: #000000;
  letter-spacing: -0.5px;
  text-align: center;
}

/* ============================================================
   TABS
   ============================================================ */
.tabs {
  display: flex;
  justify-content: center;
  gap: 2px;
  padding: 12px 24px 0;
  background: var(--bg);
  border-bottom: 2px solid rgba(0,0,0,0.07);
  flex-wrap: wrap;
}

.tab-btn {
  padding: 10px 28px;
  border: none;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--text-muted);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  border-radius: 10px 10px 0 0;
  transition: all var(--transition);
}

.tab-btn:hover { color: #000000; background: rgba(0,0,0,0.03); }

.tab-btn.active {
  color: var(--tab-active);
  border-bottom-color: var(--tab-active);
}

/* ============================================================
   MAIN & SECTIONS
   ============================================================ */
main { padding: 24px 20px; max-width: 1100px; margin: 0 auto; }

.content-section { display: none; }
.content-section.active { display: block; }

/* ============================================================
   CARDS GRID
   ============================================================ */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 14px;
}

.blending-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }

.sentences-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

/* ============================================================
   CARD
   ============================================================ */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 10px 14px;
  text-align: center;
  cursor: pointer;
  position: relative;
  border: 2px solid transparent;
  transition: transform var(--transition), box-shadow var(--transition),
              border-color var(--transition), background var(--transition);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
  border-color: var(--season-color);
  background: var(--card-hover);
}

.card:active { transform: scale(0.95); }

.card.playing {
  border-color: var(--season-color);
  background: var(--season-light);
  animation: card-pop 0.45s ease;
}

@keyframes card-pop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.07); }
  70%  { transform: scale(0.97); }
  100% { transform: scale(1); }
}

/* Card elements */
.card-emoji  { font-size: 1.6rem; line-height: 1; margin-bottom: 5px; }

.card-main {
  font-size: 2rem;
  font-weight: 900;
  color: #000000;
  line-height: 1;
}

.card-main-lower {
  font-size: 1.2rem;
  font-weight: 700;
  color: #000000;
  margin-top: 2px;
}

.card-sub {
  font-size: 0.72rem;
  color: #000000;
  font-weight: 700;
  margin-top: 4px;
  text-transform: lowercase;
}

/* Blending letter chips */
.blend-letters { display: flex; justify-content: center; gap: 3px; margin-top: 7px; flex-wrap: wrap; }

.blend-l {
  font-size: 0.82rem;
  font-weight: 800;
  background: var(--blend-chip);
  color: #000000;
  border-radius: 5px;
  padding: 2px 5px;
  transition: background var(--transition);
}

/* ============================================================
   SENTENCE CARD
   ============================================================ */
.card-sentence {
  padding: 22px 16px 18px;
  text-align: left;
  min-height: 80px;
  display: flex;
  align-items: center;
}

.sentence-text {
  font-size: 1.25rem;
  font-weight: 700;
  color: #000000;
  line-height: 1.5;
  padding-right: 30px;
}

/* ============================================================
   MIC BUTTON
   ============================================================ */
.mic-btn {
  position: absolute;
  top: 7px; right: 7px;
  width: 26px; height: 26px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.06);
  cursor: pointer;
  font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
  z-index: 3; line-height: 1;
}

.mic-btn:hover { background: var(--season-light); transform: scale(1.15); }

.mic-btn.has-rec {
  background: var(--season-color);
  color: #fff;
  box-shadow: 0 1px 5px rgba(0,0,0,0.18);
}

/* ============================================================
   SIGHT WORDS
   ============================================================ */
.sw-group { margin-bottom: 32px; }

.sw-heading {
  font-size: 1rem;
  font-weight: 800;
  color: #000000;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 2px solid rgba(0,0,0,0.08);
}

.sw-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }

.card-sw { padding: 20px 10px 22px; }

.sw-word { font-size: 1.6rem; font-weight: 900; color: #000000; line-height: 1; }

.sw-badge {
  position: absolute;
  bottom: 7px; left: 7px;
  font-size: 0.62rem;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 999px;
  color: #000000;
  line-height: 1.4;
}

/* ============================================================
   MODAL OVERLAY
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(20,20,30,0.38);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: none; align-items: center; justify-content: center;
  z-index: 200; padding: 20px;
}

.modal-overlay.open { display: flex; }

/* ============================================================
   MODAL
   ============================================================ */
.modal {
  background: #fff;
  border-radius: 26px;
  padding: 34px 30px 28px;
  max-width: 420px; width: 100%;
  position: relative;
  box-shadow: 0 28px 70px rgba(0,0,0,0.22);
  animation: modal-in 0.22s ease;
}

@keyframes modal-in {
  from { opacity: 0; transform: scale(0.92) translateY(12px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-close {
  position: absolute; top: 14px; right: 14px;
  width: 34px; height: 34px;
  border-radius: 50%; border: none;
  background: rgba(0,0,0,0.07); color: #000000;
  font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition);
}

.modal-close:hover { background: rgba(0,0,0,0.13); }

#modal-title { font-size: 1.35rem; font-weight: 900; color: #000000; margin-bottom: 4px; }

.modal-for { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 20px; }

/* ============================================================
   RECORDER VISUALISER
   ============================================================ */
.recorder-viz {
  height: 80px;
  background: var(--bg);
  border-radius: 14px;
  margin-bottom: 12px;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 10px 14px;
  transition: background var(--transition);
}

.viz-idle { font-size: 2.4rem; opacity: 0.4; }

.waveform {
  display: flex; align-items: center; gap: 3px;
  height: 100%; width: 100%; justify-content: center;
}

.wave-bar {
  width: 5px; min-height: 3px; border-radius: 3px;
  background: var(--season-color);
  transition: height 0.05s ease;
}

.record-timer {
  text-align: center; font-size: 1.1rem; font-weight: 700;
  color: var(--season-color); min-height: 1.4em; margin-bottom: 16px;
}

/* ============================================================
   RECORDER BUTTONS
   ============================================================ */
.recorder-controls {
  display: flex; gap: 10px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 14px;
}

.btn {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 20px; border-radius: 999px; border: none;
  font-size: 0.92rem; font-weight: 700; cursor: pointer;
  transition: all var(--transition); color: var(--text);
}

.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn-icon { font-size: 1rem; }

.btn-record { background: #fdd8d8; color: #b02020; }
.btn-record:hover:not(:disabled) { background: #fcbbbb; }
.btn-record.recording { background: #e83030; color: #fff; animation: rec-pulse 1.1s ease infinite; }

@keyframes rec-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.72; }
}

.btn-preview { background: #d5f0d5; color: #1a6e1a; }
.btn-preview:hover:not(:disabled) { background: #b8e8b8; }

.btn-save { background: var(--season-light); color: var(--text); }
.btn-save:hover:not(:disabled) { filter: brightness(0.94); }

.btn-delete-rec {
  display: block; width: 100%; text-align: center;
  margin-bottom: 12px; padding: 8px;
  border: none; background: none;
  color: var(--text-muted); font-size: 0.85rem; font-weight: 600;
  cursor: pointer; border-radius: 8px;
  transition: background var(--transition), color var(--transition);
}

.btn-delete-rec:hover { background: rgba(0,0,0,0.05); color: #c0392b; }

.record-status { text-align: center; font-size: 0.87rem; color: var(--text-muted); min-height: 1.2em; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 600px) {
  h1 { font-size: 1.55rem; }
  .tab-btn { padding: 9px 14px; font-size: 0.88rem; }
  main { padding: 16px 12px; }
  .cards-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
  .blending-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
  .sentences-grid { grid-template-columns: 1fr; }
  .card { padding: 14px 8px 12px; }
  .card-main { font-size: 1.7rem; }
  .card-emoji { font-size: 1.3rem; }
  .sentence-text { font-size: 1.1rem; }
  .modal { padding: 28px 20px 22px; border-radius: 20px; }
}
  </style>
</head>
<body>

  <header>
    <h1>📚 Phonics App</h1>
  </header>

  <nav class="tabs" aria-label="Section selector">

// ── IndexedDB ──────────────────────────────────────────────
let db;
function openDB() {
  return new Promise((res,rej) => {
    const req = indexedDB.open('PhonicsAppDB',1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('recordings');
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}
function dbPut(key,val) {
  return new Promise((res,rej) => {
    const tx = db.transaction('recordings','readwrite');
    tx.objectStore('recordings').put(val,key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
function dbGet(key) {
  return new Promise((res,rej) => {
    const tx = db.transaction('recordings','readonly');
    const req = tx.objectStore('recordings').get(key);
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  });
}
function dbDelete(key) {
  return new Promise((res,rej) => {
    const tx = db.transaction('recordings','readwrite');
    tx.objectStore('recordings').delete(key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
function dbGetAllKeys() {
  return new Promise((res,rej) => {
    const tx = db.transaction('recordings','readonly');
    const req = tx.objectStore('recordings').getAllKeys();
    req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
  });
}

// ── State ──────────────────────────────────────────────────
const rec = {key:null,recorder:null,chunks:[],blob:null,timerID:null,startMs:0,audioCtx:null,animID:null};

// ── TTS ────────────────────────────────────────────────────
function ttsSpeak(text, rate=0.82, pitch=1.05) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = rate; u.pitch = pitch;
  window.speechSynthesis.speak(u);
}

// ── Play ───────────────────────────────────────────────────
async function playItem(key, ttsTexts, rate=0.82) {
  const card = document.querySelector('[data-key="'+key+'"]');
  if (card) {
    card.classList.remove('playing'); void card.offsetWidth;
    card.classList.add('playing');
    setTimeout(() => card.classList.remove('playing'), 700);
  }
  const blob = await dbGet(key);
  if (blob) {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => URL.revokeObjectURL(url);
    audio.play().catch(()=>{});
    return;
  }
  window.speechSynthesis.cancel();
  for (const text of ttsTexts) ttsSpeak(text, rate);
}

// ── Helpers ────────────────────────────────────────────────
async function recordedKeys() {
  try { return new Set(await dbGetAllKeys()); } catch { return new Set(); }
}
function micButton(key, label, hasRec) {
  const btn = document.createElement('button');
  btn.className = 'mic-btn' + (hasRec ? ' has-rec' : '');
  btn.textContent = '🎙️';
  btn.title = 'Record your voice';
  btn.setAttribute('aria-label', label);
  return btn;
}

// ── Render: Numbers ────────────────────────────────────────
async function renderNumbers() {
  const grid = document.getElementById('numbers-grid');
  grid.innerHTML = '';
  const keys = await recordedKeys();
  for (let i = 1; i <= 20; i++) {
    const key = 'number-'+i, word = NUMBER_WORDS[i-1];
    const card = document.createElement('div');
    card.className = 'card'; card.dataset.key = key;
    card.setAttribute('role','button'); card.setAttribute('tabindex','0');
    card.setAttribute('aria-label', i+', '+word+'. Tap to hear.');
    const mic = micButton(key, 'Record your voice for number '+i, keys.has(key));
    card.appendChild(mic);
    card.insertAdjacentHTML('beforeend',
      '<div class="card-emoji">'+NUMBER_EMOJIS[i-1]+'</div>'+
      '<div class="card-main">'+i+'</div>'+
      '<div class="card-sub">'+word+'</div>'
    );
    mic.addEventListener('click', e => { e.stopPropagation(); openModal(key, 'Number '+i+' — "'+word+'"'); });
    card.addEventListener('click', () => playItem(key, [word]));
    card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') playItem(key,[word]); });
    grid.appendChild(card);
  }
}

// ── Render: Sounds ─────────────────────────────────────────
async function renderSounds() {
  const grid = document.getElementById('sounds-grid');
  grid.innerHTML = '';
  const keys = await recordedKeys();
  for (const letter of 'abcdefghijklmnopqrstuvwxyz') {
    const key = 'sound-'+letter, ph = PHONICS[letter];
    const card = document.createElement('div');
    card.className = 'card'; card.dataset.key = key;
    card.setAttribute('role','button'); card.setAttribute('tabindex','0');
    card.setAttribute('aria-label', 'Letter '+letter.toUpperCase()+', as in '+ph.hint+'. Tap to hear.');
    const mic = micButton(key, 'Record your voice for letter '+letter.toUpperCase(), keys.has(key));
    card.appendChild(mic);
    card.insertAdjacentHTML('beforeend',
      '<div class="card-emoji">'+ph.emoji+'</div>'+
      '<div class="card-main">'+letter.toUpperCase()+'</div>'+
      '<div class="card-main card-main-lower">'+letter+'</div>'+
      '<div class="card-sub">'+ph.hint+'</div>'
    );
    mic.addEventListener('click', e => { e.stopPropagation(); openModal(key, 'Letter '+letter.toUpperCase()+' — "'+ph.hint+'"'); });
    card.addEventListener('click', () => playItem(key, [ph.tts]));
    card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') playItem(key,[ph.tts]); });
    grid.appendChild(card);
  }
}

// ── Render: Blending ───────────────────────────────────────
async function renderBlending() {
  const grid = document.getElementById('blending-grid');
  grid.innerHTML = '';
  const keys = await recordedKeys();
  for (const word of BLENDING_WORDS) {
    const key = 'blend-'+word, tts = [...word.split(''), word];
    const card = document.createElement('div');
    card.className = 'card card-blend'; card.dataset.key = key;
    card.setAttribute('role','button'); card.setAttribute('tabindex','0');
    card.setAttribute('aria-label', 'Blend the word "'+word+'". Tap to hear.');
    const mic = micButton(key, 'Record your voice for the word "'+word+'"', keys.has(key));
    card.appendChild(mic);
    const chips = word.split('').map(l => '<span class="blend-l">'+l+'</span>').join('');
    card.insertAdjacentHTML('beforeend',
      '<div class="card-main">'+word+'</div>'+
      '<div class="blend-letters">'+chips+'</div>'
    );
    mic.addEventListener('click', e => { e.stopPropagation(); openModal(key, 'Word: "'+word+'"'); });
    card.addEventListener('click', () => playItem(key, tts));
    card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') playItem(key,tts); });
    grid.appendChild(card);
  }
}

// ── Render: Sentences (slow reading) ──────────────────────
async function renderSentences() {
  const grid = document.getElementById('sentences-grid');
  grid.innerHTML = '';
  const keys = await recordedKeys();
  SENTENCES.forEach((text, idx) => {
    const key = 'sentence-'+idx;
    const card = document.createElement('div');
    card.className = 'card card-sentence'; card.dataset.key = key;
    card.setAttribute('role','button'); card.setAttribute('tabindex','0');
    card.setAttribute('aria-label', text+' Tap to hear.');
    const mic = micButton(key, 'Record your voice for: "'+text+'"', keys.has(key));
    card.appendChild(mic);
    card.insertAdjacentHTML('beforeend', '<div class="sentence-text">'+text+'</div>');
    mic.addEventListener('click', e => { e.stopPropagation(); openModal(key, text); });
    card.addEventListener('click', () => playItem(key, [text], 0.65));
    card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') playItem(key,[text],0.65); });
    grid.appendChild(card);
  });
}

// ── Render: Sight Words ────────────────────────────────────
const LEVEL_LABELS = {1:'Level 1 — Pre-primer', 2:'Level 2 — Primer', 3:'Level 3 — Grade 1'};
const LEVEL_COLORS = {1:'#c8f0a8', 2:'#fff3a0', 3:'#ffd0a0'};

async function renderSightWords() {
  const container = document.getElementById('sightwords-grid');
  container.innerHTML = '';
  const keys = await recordedKeys();
  const byLevel = {1:[],2:[],3:[]};
  SIGHT_WORDS.forEach(sw => byLevel[sw.level].push(sw));
  for (const level of [1,2,3]) {
    const group = document.createElement('div');
    group.className = 'sw-group';
    const heading = document.createElement('h2');
    heading.className = 'sw-heading';
    heading.textContent = LEVEL_LABELS[level];
    group.appendChild(heading);
    const grid = document.createElement('div');
    grid.className = 'cards-grid sw-grid';
    group.appendChild(grid);
    for (const {word} of byLevel[level]) {
      const key = 'sight-'+word;
      const card = document.createElement('div');
      card.className = 'card card-sw'; card.dataset.key = key;
      card.setAttribute('role','button'); card.setAttribute('tabindex','0');
      card.setAttribute('aria-label', 'Sight word: '+word+'. Tap to hear.');
      const mic = micButton(key, 'Record your voice for the word "'+word+'"', keys.has(key));
      card.appendChild(mic);
      const badge = document.createElement('span');
      badge.className = 'sw-badge'; badge.textContent = 'L'+level;
      badge.style.background = LEVEL_COLORS[level];
      card.appendChild(badge);
      card.insertAdjacentHTML('beforeend', '<div class="card-main sw-word">'+word+'</div>');
      mic.addEventListener('click', e => { e.stopPropagation(); openModal(key, 'Sight word: "'+word+'"'); });
      card.addEventListener('click', () => playItem(key,[word]));
      card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') playItem(key,[word]); });
      grid.appendChild(card);
    }
    container.appendChild(group);
  }
}

// ── Tabs ───────────────────────────────────────────────────
function setTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const on = btn.dataset.tab === tab;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-selected', String(on));
  });
  document.querySelectorAll('.content-section').forEach(sec => {
    sec.classList.toggle('active', sec.id === tab+'-section');
  });
}

// ── Modal ──────────────────────────────────────────────────
function setStatus(msg) { document.getElementById('record-status').textContent = msg; }

function openModal(key, label) {
  rec.key = key; rec.blob = null; rec.chunks = [];
  document.getElementById('modal-item-label').textContent = label;
  document.getElementById('btn-play-preview').disabled = true;
  document.getElementById('btn-save').disabled = true;
  document.getElementById('record-timer').textContent = '';
  const recBtn = document.getElementById('btn-record');
  recBtn.className = 'btn btn-record';
  recBtn.querySelector('.btn-label').textContent = 'Record';
  recBtn.querySelector('.btn-icon').textContent  = '🎙️';
  setStatus('Click Record to start');
  clearWaveform();
  dbGet(key).then(existing => {
    const del = document.getElementById('btn-delete');
    del.style.display = existing ? 'block' : 'none';
    if (existing) setStatus('You have a saved recording. Record again to replace it.');
  });
  document.getElementById('record-modal').classList.add('open');
  document.getElementById('modal-close').focus();
}

function closeModal() {
  stopRecording();
  document.getElementById('record-modal').classList.remove('open');
}

// ── Recording ──────────────────────────────────────────────
async function toggleRecording() {
  if (rec.recorder && rec.recorder.state === 'recording') { rec.recorder.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true,video:false}); }
  catch { setStatus('❌ Microphone access denied. Please allow microphone access and try again.'); return; }
  rec.chunks = []; rec.blob = null;
  rec.recorder = new MediaRecorder(stream);
  rec.recorder.ondataavailable = e => { if (e.data.size > 0) rec.chunks.push(e.data); };
  rec.recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    stopWaveform(); clearInterval(rec.timerID);
    rec.blob = new Blob(rec.chunks, {type: rec.recorder.mimeType || 'audio/webm'});
    const btn = document.getElementById('btn-record');
    btn.className = 'btn btn-record';
    btn.querySelector('.btn-label').textContent = 'Record Again';
    btn.querySelector('.btn-icon').textContent  = '🎙️';
    document.getElementById('btn-play-preview').disabled = false;
    document.getElementById('btn-save').disabled = false;
    setStatus('Done! Preview it or save to keep it.');
  };
  rec.recorder.start();
  const btn = document.getElementById('btn-record');
  btn.className = 'btn btn-record recording';
  btn.querySelector('.btn-label').textContent = 'Stop';
  btn.querySelector('.btn-icon').textContent  = '⏹️';
  setStatus('Recording… tap Stop when done.');
  rec.startMs = Date.now();
  rec.timerID = setInterval(() => {
    const s = Math.floor((Date.now()-rec.startMs)/1000);
    document.getElementById('record-timer').textContent =
      Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  }, 500);
  startWaveform(stream);
}

function stopRecording() {
  if (rec.recorder && rec.recorder.state === 'recording') rec.recorder.stop();
  clearInterval(rec.timerID); stopWaveform();
}

function playPreview() {
  if (!rec.blob) return;
  const url = URL.createObjectURL(rec.blob);
  const audio = new Audio(url);
  setStatus('Playing preview…');
  audio.onended = () => { URL.revokeObjectURL(url); setStatus('Preview done. Save to keep it.'); };
  audio.play().catch(() => setStatus('Could not play audio.'));
}

async function saveRecording() {
  if (!rec.blob || !rec.key) return;
  await dbPut(rec.key, rec.blob);
  const card = document.querySelector('[data-key="'+rec.key+'"]');
  if (card) card.querySelector('.mic-btn')?.classList.add('has-rec');
  setStatus('✓ Saved!'); setTimeout(closeModal, 750);
}

async function deleteExistingRecording() {
  if (!rec.key) return;
  await dbDelete(rec.key);
  const card = document.querySelector('[data-key="'+rec.key+'"]');
  if (card) card.querySelector('.mic-btn')?.classList.remove('has-rec');
  document.getElementById('btn-delete').style.display = 'none';
  setStatus('Custom recording removed.'); setTimeout(closeModal, 750);
}

// ── Waveform ───────────────────────────────────────────────
function startWaveform(stream) {
  const waveEl = document.getElementById('waveform');
  const idleEl = document.getElementById('viz-idle');
  idleEl.style.display = 'none'; waveEl.innerHTML = '';
  const BAR_COUNT = 26, bars = [];
  for (let i = 0; i < BAR_COUNT; i++) {
    const b = document.createElement('div');
    b.className = 'wave-bar'; waveEl.appendChild(b); bars.push(b);
  }
  rec.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const analyser = rec.audioCtx.createAnalyser();
  analyser.fftSize = 64;
  rec.audioCtx.createMediaStreamSource(stream).connect(analyser);
  const data = new Uint8Array(analyser.frequencyBinCount);
  function draw() {
    rec.animID = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(data);
    bars.forEach((bar,i) => {
      const val = data[Math.floor(i*data.length/BAR_COUNT)]||0;
      bar.style.height = Math.max(3,Math.round((val/255)*58))+'px';
    });
  }
  draw();
}

function stopWaveform() {
  if (rec.animID) { cancelAnimationFrame(rec.animID); rec.animID = null; }
  if (rec.audioCtx) { rec.audioCtx.close().catch(()=>{}); rec.audioCtx = null; }
  clearWaveform();
}

function clearWaveform() {
  const waveEl = document.getElementById('waveform');
  const idleEl = document.getElementById('viz-idle');
  if (waveEl) waveEl.innerHTML = '';
  if (idleEl) idleEl.style.display = '';
}

// ── Boot ───────────────────────────────────────────────────
async function init() {
  db = await openDB();
  document.querySelectorAll('.tab-btn').forEach(btn =>
    btn.addEventListener('click', () => setTab(btn.dataset.tab))
  );
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('record-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.getElementById('btn-record').addEventListener('click', toggleRecording);
  document.getElementById('btn-play-preview').addEventListener('click', playPreview);
  document.getElementById('btn-save').addEventListener('click', saveRecording);
  document.getElementById('btn-delete').addEventListener('click', deleteExistingRecording);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('record-modal').classList.contains('open'))
      closeModal();
  });
  await Promise.all([renderNumbers(), renderSounds(), renderBlending(), renderSentences(), renderSightWords()]);
}

init().catch(console.error);
  </script>
